# examples/config_custom.yaml
name: "SmartAgentCustom"
version: "1.0"

# Here is the magic:
provider: "custom"
custom_module_path: "examples/custom_model.py"
custom_function_name: "complete_fn"

# Everything else remains the same, your custom function will handle texts
temperature: 0.7
max_response_length: 4000

mentor_enabled: true
mentor_interval_sec: 10.0
deep_thinker_enabled: true
