[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-agent-arch"
version = "0.6.0"
description = "A neutral Python library scaffold with extensible architecture primitives."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "NexLab" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
