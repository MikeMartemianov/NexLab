[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-agent-arch"
version = "0.9.1"
description = "NexLab AI Code Editor - Professional Agent Framework with CLI and Dynamic Tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "NexLab" }
]
dependencies = [
  "rich>=13.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
nexlab = "smart_agent_arch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

