[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-agent-arch"
version = "1.8.0"
description = "NexLab AI Framework 1.8.0 - Configuration Fix, Multi-Project Orchestrator, and Visual Flow Engine."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "NexLab" }
]
dependencies = [
  "rich>=13.0",
  "docker"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]
advanced = [
  "opencv-python",
  "face_recognition",
  "numpy",
  "google-generativeai",
  "Pillow",
  "scipy",
  "soundfile"
  # Note: parler-tts should be installed manually via git:
  # pip install git+https://github.com/huggingface/parler-tts.git
]

[project.scripts]
nexlab = "smart_agent_arch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

